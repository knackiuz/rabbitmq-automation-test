name: Java CI with Docker

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Build the Docker image using the Dockerfile
      - name: Build Docker Image
        run: docker build -t rabbit-test-app .

      # Step 3: Run the container to execute Maven tests
      # The container will connect to CloudAMQP via the internet
      - name: Run Tests in Container
        run: docker run --rm rabbit-test-app
